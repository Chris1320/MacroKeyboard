[project]
name = "macrokeyboard"
version = "0.1.0"
description = "Use a second keyboard as a macropad."
readme = "README.md"
authors = [
    { name = "Chris1320", email = "me@chrisfromnowhere.me" }
]
requires-python = ">=3.14"
dependencies = [
    "inputs>=0.5",
    "pyside6>=6.11.0",
]

[project.scripts]
macrokeyboard = "macrokeyboard:main"

[build-system]
requires = ["uv_build>=0.11.1,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "pylint>=4.0.5",
]
